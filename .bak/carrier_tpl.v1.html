<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الناقل — نَقْل</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function showToast(msg, isError=false){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.className='toast'+(isError?' error':''); t.style.display='block';
  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>{ t.style.display='none' },2800);
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F1F5F9;direction:rtl;color:#0f172a}
.phone{max-width:560px;margin:0 auto;min-height:100vh;background:#F1F5F9;padding-bottom:20px}
.topbar{background:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;box-shadow:0 1px 10px rgba(0,0,0,.06);position:sticky;top:0;z-index:600}
.topbar h1{font-size:15px;font-weight:900;flex:1}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;font-weight:900;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.pill.wallet{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.pill.wallet.neg{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.pill.veh{background:#f0fdfa;border-color:#99f6e4;color:#115e59}
.tabs{display:flex;gap:6px;padding:10px 12px 0}
.tab{flex:1;height:38px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;font-weight:900;font-size:12px;cursor:pointer}
.tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.tab i{font-style:normal;background:#e2e8f0;color:#0f172a;border-radius:999px;padding:1px 7px;margin-right:4px;font-size:10px}
.tab.active i{background:#fff}
#feedMap{height:230px;margin:10px 12px 0;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden}
.radius{margin:6px 12px 0;font-size:11px;color:#64748b;font-weight:700;display:flex;justify-content:space-between}
.card{margin:10px 12px 0;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card.hl{border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.cHead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cHead b{font-size:14px;flex:1}
.tag{font-size:10px;font-weight:900;padding:3px 8px;border-radius:999px;background:#f1f5f9;color:#334155;white-space:nowrap}
.tag.urg{background:#fef3c7;color:#92400e} .tag.veh{background:#f0fdfa;color:#115e59}
.tag.mine{background:#eef2ff;color:#3730a3}
.route{margin-top:8px;font-size:12px;line-height:1.7}
.route div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics{display:flex;gap:6px;margin-top:8px}
.metric{flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:6px;text-align:center}
.metric b{display:block;font-size:13px} .metric span{font-size:10px;color:#64748b}
.budgetLine{margin-top:8px;font-size:13px;font-weight:900;color:#4F46E5}
.extras{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.extras span{font-size:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:999px;padding:2px 8px}
.banner{margin:10px 12px 0;border-radius:14px;padding:14px;text-align:center;font-size:12px;font-weight:800;line-height:1.7}
.banner.neg{background:#fef2f2;border:1.5px solid #fecaca;color:#991b1b}
.banner.info{background:#fff;border:1px solid #e2e8f0;color:#64748b}
.banner button{margin-top:8px;height:40px;padding:0 18px;border-radius:12px;border:none;background:#16a34a;color:#fff;font-weight:900;cursor:pointer}
.sim{margin:12px auto 0;display:block;height:34px;padding:0 14px;border-radius:999px;border:1px dashed #cbd5e1;background:#fff;color:#475569;font-weight:800;font-size:11px;cursor:pointer}
/* لوحة التفاصيل */
.sheetBg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;z-index:1500;align-items:flex-end;justify-content:center}
.sheetBg.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;overflow:auto;padding:14px 14px 18px}
.sHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sHead b{flex:1;font-size:15px}
.sHead button{width:34px;height:34px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;cursor:pointer}
#dMap{height:220px;border-radius:14px;border:1px solid #e2e8f0;overflow:hidden}
.legend{display:flex;gap:10px;justify-content:center;font-size:10px;color:#64748b;margin-top:4px}
.dl{margin-top:10px;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.dl div{display:flex;gap:8px;padding:8px 10px;font-size:12px;border-bottom:1px solid #f1f5f9}
.dl div:last-child{border-bottom:none}
.dl span{color:#64748b;min-width:78px;font-weight:700}
.dl b{flex:1;font-weight:800}
.hidden{margin-top:10px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:10px;font-size:11px;color:#64748b;text-align:center;font-weight:700}
.acts{margin-top:12px;display:grid;gap:8px}
.btn{height:48px;border-radius:14px;border:none;font-weight:900;font-size:14px;cursor:pointer}
.btn.pri{background:#4F46E5;color:#fff} .btn.sec{background:#fff;color:#4F46E5;border:1.5px solid #c7d2fe}
.btn.ok{background:#16a34a;color:#fff} .btn.danger{background:#fff;color:#991b1b;border:1.5px solid #fecaca}
.btn:disabled{background:#cbd5e1;color:#64748b;border:none}
.offerBox{display:none;margin-top:4px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px}
.offerBox input,.offerBox textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px;font-size:14px;font-family:inherit;outline:none}
.offerBox input{font-size:20px;font-weight:900;text-align:center;height:52px}
.offerBox textarea{margin-top:8px;font-size:12px;min-height:54px;resize:vertical}
.ofHint{font-size:11px;color:#64748b;text-align:center;margin-top:6px;font-weight:700}
.ofHint.err{color:#b91c1c}
.myOffer{margin-top:10px;background:#eef2ff;border:1.5px solid #c7d2fe;border-radius:14px;padding:12px;text-align:center;font-weight:900;color:#3730a3}
/* نافذة منبثقة */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:2500;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:380px;text-align:center}
.modal h3{font-size:15px;font-weight:900}
.modal .big{font-size:30px;font-weight:900;color:#4F46E5;margin:8px 0}
.cm{margin-top:10px;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;text-align:right}
.cm div{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.cm div:last-child{border-bottom:none}
.cm .neg{color:#b91c1c;font-weight:900}
.warn{margin-top:10px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:8px;font-size:11px;font-weight:800;line-height:1.6}
.mBtns{display:flex;gap:8px;margin-top:14px} .mBtns button{flex:1;height:46px;border-radius:12px;font-weight:900;cursor:pointer;border:1px solid #e2e8f0;background:#fff}
.mBtns .yes{background:#4F46E5;color:#fff;border:none;flex:2}
/* المركبة والمحفظة */
.vGroup{margin-top:10px;text-align:right} .vGroup b{font-size:11px;color:#475569;display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vChip{padding:9px 12px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;font-size:12px;font-weight:800;cursor:pointer;min-width:66px;text-align:center}
.vChip.active{background:#0f766e;color:#fff;border-color:#0f766e}
.bal{font-size:32px;font-weight:900;margin:6px 0}
.bal.neg{color:#b91c1c} .bal.pos{color:#065f46}
.tx{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:12px;text-align:right}
.tx b.m{color:#b91c1c} .tx b.p{color:#16a34a}
.tx small{display:block;color:#94a3b8;font-size:10px}
.topRow{display:flex;gap:6px;margin-top:10px}
.topRow button{flex:1;height:40px;border-radius:12px;border:1.5px solid #a7f3d0;background:#ecfdf5;color:#065f46;font-weight:900;cursor:pointer}
/* أعمالي */
.job{margin:10px 12px 0;background:#fff;border:1.5px solid #a7f3d0;border-radius:16px;padding:12px}
.job .cust{margin-top:8px;background:#f0fdf4;border-radius:12px;padding:10px;font-size:12px}
.job .cust b{font-size:14px}
.jobBtns{display:flex;gap:6px;margin-top:10px}
.jobBtns a,.jobBtns button{flex:1;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:12px;text-decoration:none;cursor:pointer;border:none}
.call{background:#16a34a;color:#fff} .nav{background:#eef2ff;color:#3730a3} .done{background:#0f172a;color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;display:none;max-width:90%;text-align:center}
.toast.error{background:#991b1b}
</style>
</head>
<body>
<div class="phone">
 <div class="topbar">
  <h1>🚚 لوحة الناقل</h1>
  <button class="pill veh" id="vehPill" onclick="openVehicle()">—</button>
  <button class="pill wallet" id="walletPill" onclick="openWallet()">$0.00</button>
 </div>
 <div class="tabs">
  <button class="tab active" id="tab-feed" onclick="setTab('feed')">الطلبات<i id="cntFeed">0</i></button>
  <button class="tab" id="tab-offers" onclick="setTab('offers')">عروضي<i id="cntOffers">0</i></button>
  <button class="tab" id="tab-jobs" onclick="setTab('jobs')">أعمالي<i id="cntJobs">0</i></button>
 </div>

 <div id="view-feed">
  <div id="feedMap"></div>
  <div class="radius"><span>📍 الطلبات ضمن 10 كم من موقعك</span><span id="feedCount"></span></div>
  <div id="feedList"></div>
  <button class="sim" onclick="simulateOrder()">📦 محاكاة طلب جديد</button>
 </div>
 <div id="view-offers" style="display:none"><div id="offersList"></div></div>
 <div id="view-jobs" style="display:none"><div id="jobsList"></div></div>
</div>

<!-- تفاصيل الطلب -->
<div class="sheetBg" id="detail"><div class="sheet">
 <div class="sHead"><b id="dTitle">—</b><button onclick="closeDetail()">✕</button></div>
 <div id="dMap"></div>
 <div class="legend"><span>━ مسار النقل</span><span style="color:#0ea5e9">┅ من موقعك للاستلام</span></div>
 <div class="metrics" id="dMetrics"></div>
 <div class="dl" id="dList"></div>
 <div class="hidden">👤 تظهر بيانات الزبون ورقم التواصل بعد إتمام الاتفاق</div>
 <div id="dActions"></div>
</div></div>

<!-- تأكيد العمولة -->
<div class="overlay" id="confirmModal"><div class="modal">
 <h3 id="cmTitle">قبول الطلب</h3>
 <div class="big" id="cmPrice">$0</div>
 <div class="cm" id="cmRows"></div>
 <div id="cmWarn"></div>
 <div class="mBtns"><button onclick="closeModal('confirmModal')">رجوع</button><button class="yes" id="cmYes" onclick="confirmAction()">تأكيد</button></div>
</div></div>

<!-- طلب جديد -->
<div class="overlay" id="newModal"><div class="modal">
 <h3>📦 طلب نقل جديد بالقرب منك</h3>
 <div id="nmBody" style="margin-top:8px;text-align:right"></div>
 <div class="mBtns"><button onclick="dismissNew()">لاحقاً</button><button class="yes" onclick="viewNew()">عرض التفاصيل</button></div>
</div></div>

<!-- المركبة -->
<div class="overlay" id="vehModal"><div class="modal">
 <h3>🚚 مركبتك</h3>
 <div class="ofHint">تظهر لك الطلبات المناسبة لحمولة مركبتك</div>
 <div id="vehBox"></div>
 <div class="mBtns"><button class="yes" id="vehSave" onclick="saveVehicle()" disabled>حفظ</button></div>
</div></div>

<!-- المحفظة -->
<div class="overlay" id="walletModal"><div class="modal">
 <h3>💳 رصيدك</h3>
 <div class="bal" id="wBal">$0</div>
 <div id="wNote" class="ofHint"></div>
 <div class="topRow"><button onclick="doTopUp(5)">＋$5</button><button onclick="doTopUp(10)">＋$10</button><button onclick="doTopUp(25)">＋$25</button></div>
 <div id="wTx" style="margin-top:10px;max-height:240px;overflow:auto"></div>
 <div class="mBtns"><button onclick="closeModal('walletModal')">إغلاق</button></div>
</div></div>

<div id="toast" class="toast"></div>

<script>
/*@@CARGO_JS@@*/
/*@@ROUTE_JS@@*/
const ME=DEMO_CARRIER
const MY_LOC=[33.5138,36.2765]  // موقع الناقل (في التطبيق من GPS)
const RADIUS_KM=10
let profile=lsGet(K_CARRIER,{vehicle_class:null})
const HAS_MAP=typeof L!=='undefined'
let tab='feed', feedMap=null, feedLayer=null, dMap=null, dLayer=null, current=null
const esc=s=> String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
// تصفية أولية بالبعد الجغرافي، ثم عرض المسافة الفعلية على الطريق
function geoKm(a,b){ const R=6371,t=Math.PI/180,dLa=(b[0]-a[0])*t,dLo=(b[1]-a[1])*t; const h=Math.sin(dLa/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)) }
const pk=o=>[o.pickup_points[0].lat,o.pickup_points[0].lng]
const ROAD={}  // المسافة الفعلية من موقعي إلى الاستلام
async function roadToPickup(o){
 if(ROAD[o.id]) return ROAD[o.id]
 const r=await getRoute([MY_LOC, pk(o)]); if(r.ok) ROAD[o.id]=r; return r
}
async function orderRoute(o){
 if(o.route_info && o._path) return o
 const r=await getRoute([...o.pickup_points,...o.dropoff_points].map(p=>[p.lat,p.lng]))
 if(r.ok){ o._path=r.latlngs; if(!o.route_info) o.route_info={km:r.km, min:r.min} }
 return o
}
function wallet(){ return loadWallet(ME.id) }
function blocked(){ return wallet().balance<0 }
function myOfferFor(oid){ return loadOffers().find(x=> x.order_id===oid && x.carrier_id===ME.id && x.status!=='withdrawn') }
function feed(){
 if(!profile.vehicle_class || blocked()) return []
 return loadOrders().filter(o=> o.status==='open' && vehicleFits(o.vehicle_class, profile.vehicle_class) && geoKm(MY_LOC,pk(o))<=RADIUS_KM)
   .sort((a,b)=> geoKm(MY_LOC,pk(a))-geoKm(MY_LOC,pk(b)))
}
// ===== الشريط العلوي =====
function renderTop(){
 const w=wallet(); const p=document.getElementById('walletPill')
 p.textContent='💳 '+money(w.balance)+(trialAvailable(ME.id)?' 🎁':''); p.className='pill wallet'+(w.balance<0?' neg':'')
 document.getElementById('vehPill').textContent= profile.vehicle_class? vName(profile.vehicle_class) : 'اختر مركبتك'
}
function setTab(t){ tab=t; ['feed','offers','jobs'].forEach(x=>{ document.getElementById('view-'+x).style.display=x===t?'block':'none'; document.getElementById('tab-'+x).classList.toggle('active',x===t) }); render(); if(t==='feed' && feedMap) setTimeout(()=>feedMap.invalidateSize(),60) }
// ===== الخريطة =====
const dot=(c,s=14)=> L.divIcon({html:`<div style="background:${c};width:${s}px;height:${s}px;border-radius:999px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]})
const pinTxt=(t,c)=> L.divIcon({html:`<div style="background:${c};color:#fff;min-width:26px;height:26px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:900;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)">${t}</div>`,iconSize:[26,26],iconAnchor:[13,13]})
function initFeedMap(){
 if(!HAS_MAP){ document.getElementById('feedMap').style.display='none'; return }
 feedMap=L.map('feedMap',{zoomControl:false,attributionControl:false}).setView(MY_LOC,12)
 L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19}).addTo(feedMap)
 L.circle(MY_LOC,{radius:RADIUS_KM*1000,color:'#4F46E5',weight:1.5,fillOpacity:.05}).addTo(feedMap)
 L.marker(MY_LOC,{icon:dot('#0ea5e9',18)}).addTo(feedMap)
 feedLayer=L.layerGroup().addTo(feedMap)
}
// ===== قائمة الطلبات =====
function cardHtml(o, i){
 const mine=myOfferFor(o.id), road=ROAD[o.id]
 const ex=orderExtras(o)
 return `<div class="card" id="card-${o.id}" onclick="openDetail('${o.id}')">
  <div class="cHead"><b>${i+1}. ${esc(o.cargo_type)}</b><span class="tag veh">${vName(o.vehicle_class)}</span><span class="tag ${o.timing==='urgent'?'urg':''}">${orderTiming(o)}</span></div>
  <div class="route"><div>🟢 ${esc(o.pickup_points[0].label)}${o.pickup_points.length>1?` <small>+${o.pickup_points.length-1}</small>`:''}</div><div>🔴 ${esc(o.dropoff_points[o.dropoff_points.length-1].label)}${o.dropoff_points.length>1?` <small>+${o.dropoff_points.length-1}</small>`:''}</div></div>
  <div class="metrics">
   <div class="metric"><b id="rd-${o.id}">${road&&road.ok? road.km.toFixed(1)+' كم' : '…'}</b><span>يبعد عنك</span></div>
   <div class="metric"><b>${o.route_info? o.route_info.km.toFixed(1)+' كم' : '…'}</b><span>مسافة النقل</span></div>
   <div class="metric"><b>${o.route_info? fmtMin(o.route_info.min) : '…'}</b><span>مدة الطريق</span></div>
  </div>
  ${ex.length? `<div class="extras">${ex.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
  <div class="budgetLine">${orderBudget(o)} ${mine? `<span class="tag mine">عرضك ${money(mine.price)}</span>`:''}</div>
 </div>`
}
function renderFeed(){
 const list=document.getElementById('feedList')
 if(!profile.vehicle_class){ list.innerHTML=`<div class="banner info">اختر مركبتك لتظهر لك الطلبات المناسبة<br><button onclick="openVehicle()" style="background:#0f766e">اختيار المركبة</button></div>`; feedLayer&&feedLayer.clearLayers(); document.getElementById('feedCount').textContent=''; return }
 const w=wallet()
 if(w.balance<0){
   list.innerHTML=`<div class="banner neg">رصيدك ${money(w.balance)}<br>توقف ظهور الطلبات حتى شحن الرصيد<br>يُسدَّد المبلغ المستحق تلقائياً من الشحن القادم<br><button onclick="openWallet()">شحن الرصيد</button></div>`
   feedLayer&&feedLayer.clearLayers(); document.getElementById('feedCount').textContent=''; return
 }
 const F=feed()
 document.getElementById('feedCount').textContent=F.length+' طلب'
 list.innerHTML= F.length? F.map(cardHtml).join('') : `<div class="banner info">لا توجد طلبات مناسبة لمركبتك حالياً<br>سيصلك تنبيه عند نشر طلب جديد بالقرب منك</div>`
 if(feedLayer){ feedLayer.clearLayers(); F.forEach((o,i)=> L.marker(pk(o),{icon:pinTxt(i+1,'#4F46E5')}).on('click',()=>openDetail(o.id)).addTo(feedLayer)) }
 F.forEach(async o=>{
   if(!ROAD[o.id]){ const r=await roadToPickup(o); const el=document.getElementById('rd-'+o.id); if(el) el.textContent= r.ok? r.km.toFixed(1)+' كم' : '—' }
   if(!o.route_info){ await orderRoute(o); const all=loadOrders(), x=all.find(q=>q.id===o.id); if(x && !x.route_info){ x.route_info=o.route_info; saveOrders(all); renderFeed() } }
 })
}
// ===== عروضي =====
function renderOffers(){
 const orders=loadOrders()
 const mine=loadOffers().filter(x=> x.carrier_id===ME.id && x.status!=='withdrawn' && x.status!=='accepted').sort((a,b)=>b.created_at-a.created_at)
 document.getElementById('offersList').innerHTML= mine.length? mine.map(x=>{
   const o=orders.find(q=>q.id===x.order_id)||{cargo_type:'—',pickup_points:[{label:''}],dropoff_points:[{label:''}]}
   const st= x.status==='pending'? (o.status==='open'? '<span class="tag mine">⏳ بانتظار الزبون</span>' : '<span class="tag">أُغلق الطلب</span>') : '<span class="tag" style="background:#fef2f2;color:#991b1b">اختار الزبون عرضاً آخر</span>'
   return `<div class="card" ${x.status==='pending'&&o.status==='open'? `onclick="openDetail('${o.id}')"`:''}>
    <div class="cHead"><b>${esc(o.cargo_type)}</b>${st}</div>
    <div class="route"><div>🟢 ${esc(o.pickup_points[0].label)}</div><div>🔴 ${esc(o.dropoff_points[o.dropoff_points.length-1].label)}</div></div>
    <div class="budgetLine">عرضك: ${money(x.price)} <span style="color:#64748b;font-size:11px;font-weight:700">• ${timeAgo(x.created_at)}</span></div></div>`
 }).join('') : `<div class="banner info">لا توجد عروض معلّقة</div>`
}
// ===== أعمالي =====
function navUrl(o){ const d=o.dropoff_points[o.dropoff_points.length-1]; const wp=[...o.pickup_points,...o.dropoff_points.slice(0,-1)].map(p=>p.lat+','+p.lng).join('|'); return `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}&waypoints=${encodeURIComponent(wp)}&travelmode=driving` }
function renderJobs(){
 const jobs=loadOrders().filter(o=> o.carrier_id===ME.id && (o.status==='accepted'||o.status==='completed')).sort((a,b)=>(b.accepted_at||0)-(a.accepted_at||0))
 document.getElementById('jobsList').innerHTML= jobs.length? jobs.map(o=> `<div class="job" style="${o.status==='completed'?'opacity:.6;border-color:#e2e8f0':''}">
   <div class="cHead"><b>${esc(o.cargo_type)}</b><span class="tag ${o.status==='completed'?'':'veh'}">${o.status==='completed'?'✔️ مكتمل':'✅ تم الاتفاق'}</span></div>
   <div class="route"><div>🟢 ${o.pickup_points.map(p=>esc(p.label)+(p.detail?` <small>(${esc(p.detail)})</small>`:'')).join(' ← ')}</div><div>🔴 ${o.dropoff_points.map(p=>esc(p.label)+(p.detail?` <small>(${esc(p.detail)})</small>`:'')).join(' ← ')}</div></div>
   <div class="budgetLine">💵 ${money(o.agreed_price)} <span style="color:#64748b;font-size:11px;font-weight:700">• ${o.commission===0? 'طلب تجريبي بدون عمولة' : 'العمولة '+money(o.commission??commissionOf(o.agreed_price))} • ${orderTiming(o)}</span></div>
   <div class="cust">👤 <b>${esc(o.customer.name)}</b><br>📞 ${esc(o.customer.phone)}</div>
   ${o.status==='accepted'? `<div class="jobBtns"><a class="call" href="tel:${o.customer.phone.replace(/\s/g,'')}">📞 اتصال</a><a class="nav" href="${navUrl(o)}" target="_blank">🧭 الملاحة</a><button class="done" onclick="completeJob('${o.id}')">تم التسليم</button></div>`:''}
 </div>`).join('') : `<div class="banner info">لا توجد أعمال بعد</div>`
}
function completeJob(id){ const all=loadOrders(), o=all.find(q=>q.id===id); if(!o) return; o.status='completed'; o.completed_at=Date.now(); saveOrders(all); showToast('تم تسجيل التسليم'); render() }
function render(){
 renderTop()
 document.getElementById('cntFeed').textContent=feed().length
 document.getElementById('cntOffers').textContent=loadOffers().filter(x=>x.carrier_id===ME.id && x.status==='pending').length
 document.getElementById('cntJobs').textContent=loadOrders().filter(o=>o.carrier_id===ME.id && o.status==='accepted').length
 if(tab==='feed') renderFeed(); else if(tab==='offers') renderOffers(); else renderJobs()
}
// ===== التفاصيل =====
async function openDetail(id){
 const o=loadOrders().find(q=>q.id===id); if(!o) return
 if(o.status!=='open'){ showToast('الطلب لم يعد متاحاً', true); render(); return }
 current=o
 closeModal('newModal')
 document.getElementById('dTitle').textContent='📦 '+o.cargo_type
 const row=(k,v)=> v? `<div><span>${k}</span><b>${v}</b></div>`:''
 document.getElementById('dList').innerHTML=
   row('المركبة', vName(o.vehicle_class))+
   o.pickup_points.map((p,i)=> row('استلام '+(o.pickup_points.length>1?i+1:''), esc(p.label)+(p.detail?`<br><small style="color:#64748b">${esc(p.detail)}</small>`:''))).join('')+
   o.dropoff_points.map((p,i)=> row('تسليم '+(o.dropoff_points.length>1?i+1:''), esc(p.label)+(p.detail?`<br><small style="color:#64748b">${esc(p.detail)}</small>`:''))).join('')+
   row('التوقيت', orderTiming(o))+
   row('الوزن', o.weight_kg? o.weight_kg+' كغ':'')+
   row('العمال', o.need_workers? o.workers_count+' عمال':'بدون')+
   row('المعدات', o.need_equipment? esc(o.equipment_detail):'بدون')+
   row('الطوابق', [o.lift_down? `تنزيل من ط${o.floor_from}${o.elevator_from?' ('+o.elevator_from+')':''}`:'', o.lift_up? `رفع إلى ط${o.floor_to}${o.elevator_to?' ('+o.elevator_to+')':''}`:''].filter(Boolean).join(' • ') || 'بدون')+
   row('ملاحظات', esc(o.floor_note))+
   row('الميزانية', orderBudget(o).replace(/^\S+ /,''))
 renderMetrics(o)
 renderActions(o)
 document.getElementById('detail').classList.add('open')
 setTimeout(async ()=>{
   if(!HAS_MAP){ document.getElementById('dMap').style.display='none'; const [a,b]=await Promise.all([roadToPickup(o), orderRoute(o)]); if(current===o) renderMetrics(o); return }
   if(!dMap){ dMap=L.map('dMap',{zoomControl:false,attributionControl:false}).setView(MY_LOC,12); L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19}).addTo(dMap); dLayer=L.featureGroup().addTo(dMap) }
   dMap.invalidateSize(); dLayer.clearLayers()
   L.marker(MY_LOC,{icon:dot('#0ea5e9',16)}).addTo(dLayer)
   o.pickup_points.forEach((p,i)=> L.marker([p.lat,p.lng],{icon:pinTxt('A'+(i+1),'#059669')}).addTo(dLayer))
   o.dropoff_points.forEach((p,i)=> L.marker([p.lat,p.lng],{icon:pinTxt('B'+(i+1),'#DC2626')}).addTo(dLayer))
   dMap.fitBounds(dLayer.getBounds(),{padding:[26,26]})
   const [a,b]=await Promise.all([roadToPickup(o), orderRoute(o)])
   if(current!==o) return
   if(a.ok) L.polyline(a.latlngs,{color:'#0ea5e9',weight:4,dashArray:'6 6'}).addTo(dLayer)
   if(o._path) L.polyline(o._path,{color:'#4F46E5',weight:5}).addTo(dLayer)
   dMap.fitBounds(dLayer.getBounds(),{padding:[26,26]})
   renderMetrics(o)
 },80)
}
function renderMetrics(o){
 const r=ROAD[o.id]
 document.getElementById('dMetrics').innerHTML=`
  <div class="metric"><b>${r&&r.ok? r.km.toFixed(1)+' كم':'…'}</b><span>يبعد عنك${r&&r.ok?' • '+fmtMin(r.min):''}</span></div>
  <div class="metric"><b>${o.route_info? o.route_info.km.toFixed(1)+' كم':'…'}</b><span>مسافة النقل</span></div>
  <div class="metric"><b>${o.route_info? fmtMin(o.route_info.min):'…'}</b><span>مدة الطريق</span></div>`
}
function renderActions(o){
 const box=document.getElementById('dActions'), mine=myOfferFor(o.id)
 if(mine && mine.status==='pending'){
   box.innerHTML=`<div class="myOffer">عرضك ${money(mine.price)} — بانتظار رد الزبون</div><div class="acts"><button class="btn danger" onclick="withdrawOffer('${mine.id}')">سحب العرض</button></div>`
   return
 }
 const fixed=o.budget_type==='fixed'
 box.innerHTML=`<div class="acts">
   ${fixed? `<button class="btn pri" onclick="askAccept()">قبول بـ ${money(o.budget_to)}</button><button class="btn sec" onclick="toggleOffer()">تقديم عرض بسعر آخر</button>` : `<button class="btn pri" onclick="toggleOffer()">تقديم عرض سعر</button>`}
  </div>
  <div class="offerBox" id="offerBox">
   <input id="ofPrice" type="number" inputmode="decimal" placeholder="$0.00" oninput="checkOffer()">
   <div class="ofHint" id="ofHint">${fixed? `ضمن ميزانية الزبون: ${money(o.budget_from)} – ${money(o.budget_to)}` : 'اكتب السعر الذي تراه مناسباً'}</div>
   <textarea id="ofMsg" placeholder="ملاحظة للزبون (اختياري)"></textarea>
   <div class="acts"><button class="btn pri" id="ofSend" disabled onclick="askOffer()">إرسال العرض</button></div>
  </div>`
 if(!fixed) toggleOffer(true)
}
function toggleOffer(force){ const b=document.getElementById('offerBox'); b.style.display= force||b.style.display!=='block'? 'block':'none'; if(b.style.display==='block') setTimeout(()=>document.getElementById('ofPrice').focus(),50) }
function offerValid(){
 const v=parseFloat(document.getElementById('ofPrice').value), o=current
 if(!(v>0)) return 'اكتب سعر العرض'
 if(o.budget_type==='fixed' && (v<o.budget_from || v>o.budget_to)) return `السعر يجب أن يكون بين ${money(o.budget_from)} و ${money(o.budget_to)}`
 return ''
}
function checkOffer(){ const e=offerValid(), h=document.getElementById('ofHint'); document.getElementById('ofSend').disabled=!!e
 if(e && document.getElementById('ofPrice').value!==''){ h.textContent=e; h.className='ofHint err' } else { h.textContent= current.budget_type==='fixed'? `ضمن ميزانية الزبون: ${money(current.budget_from)} – ${money(current.budget_to)}` : 'اكتب السعر الذي تراه مناسباً'; h.className='ofHint' } }
function closeDetail(){ document.getElementById('detail').classList.remove('open'); current=null }
// ===== التأكيد مع العمولة =====
let pending=null
function showConfirm(kind, price){
 const w=wallet(), trial=trialAvailable(ME.id), c=nextCommission(ME.id, price), after=Math.round((w.balance-c)*100)/100
 pending={kind, price}
 document.getElementById('cmTitle').textContent= kind==='accept'? 'قبول الطلب مباشرة' : 'إرسال عرض السعر'
 document.getElementById('cmPrice').textContent=money(price)
 document.getElementById('cmRows').innerHTML=(trial? `<div style="background:#ecfdf5;color:#065f46;font-weight:900;justify-content:center">🎁 طلبك الأول مجاني — بدون عمولة</div>` : '')+`<div><span>عمولة التطبيق ${COMMISSION_PCT}</span><b>${trial? '<s style="color:#94a3b8">'+money(commissionOf(price))+'</s> $0.00' : money(c)}</b></div><div><span>رصيدك الحالي</span><b>${money(w.balance)}</b></div><div><span>رصيدك بعد ${kind==='accept'?'القبول':'قبول الزبون لعرضك'}</span><b class="${after<0?'neg':''}">${money(after)}</b></div>`
 document.getElementById('cmWarn').innerHTML= after<0? `<div class="warn">رصيدك لا يكفي للعمولة: سيُسجَّل ${money(-after)} مستحقاً ويُسدَّد من الشحن القادم، وتتوقف الطلبات عن الظهور حتى الشحن</div>` : ''
 document.getElementById('cmYes').textContent= kind==='accept'? 'تأكيد القبول' : 'إرسال العرض'
 document.getElementById('confirmModal').classList.add('open')
}
function askAccept(){ showConfirm('accept', current.budget_to) }
function askOffer(){ if(offerValid()) return; showConfirm('offer', parseFloat(document.getElementById('ofPrice').value)) }
function confirmAction(){
 closeModal('confirmModal'); const o=current; if(!o||!pending) return
 const orders=loadOrders(), fresh=orders.find(q=>q.id===o.id)
 if(!fresh || fresh.status!=='open'){ closeDetail(); showToast('الطلب لم يعد متاحاً', true); render(); return }
 if(blocked()){ closeDetail(); showToast('اشحن رصيدك أولاً', true); render(); return }
 if(pending.kind==='accept'){
   Object.assign(fresh,{status:'accepted', carrier_id:ME.id, carrier:ME, carrier_vehicle:profile.vehicle_class, agreed_price:fresh.budget_to, accepted_via:'direct', accepted_at:Date.now()})
   const offers=loadOffers(); offers.forEach(f=>{ if(f.order_id===fresh.id && f.status==='pending') f.status='rejected' }); saveOffers(offers)
   saveOrders(orders)
   const ch=chargeCommission(ME.id, fresh.id, fresh.agreed_price); fresh.commission=ch.commission; saveOrders(orders)
   closeDetail(); notify(880); showToast(ch.trial? 'تم قبول الطلب • طلبك التجريبي بدون عمولة' : `تم قبول الطلب • خُصمت العمولة ${money(ch.commission)}`); setTab('jobs')
 } else {
   const offers=loadOffers()
   offers.push({id:uid(), order_id:fresh.id, carrier_id:ME.id, carrier:ME, carrier_vehicle:profile.vehicle_class, price:pending.price, message:(document.getElementById('ofMsg').value||'').trim()||null, status:'pending', created_at:Date.now()})
   saveOffers(offers); closeDetail(); showToast('تم إرسال عرضك للزبون'); render()
 }
 pending=null
}
function withdrawOffer(id){ const offers=loadOffers(), x=offers.find(f=>f.id===id); if(x&&x.status==='pending'){ x.status='withdrawn'; saveOffers(offers) } closeDetail(); showToast('تم سحب العرض'); render() }
function closeModal(id){ document.getElementById(id).classList.remove('open') }
// ===== المركبة =====
let vehDraft=null
function openVehicle(){ vehDraft=profile.vehicle_class; renderVehBox(); document.getElementById('vehModal').classList.add('open') }
function renderVehBox(){
 document.getElementById('vehBox').innerHTML=VGROUPS.map(g=> `<div class="vGroup"><b>${g.icon} ${g.name}</b><div class="chips">${VCLASS.filter(v=>v.g===g.g).map(v=> `<div class="vChip ${vehDraft===v.k?'active':''}" onclick="vehDraft='${v.k}';renderVehBox()">${v.g==='truck'?'شاحنة':v.short}</div>`).join('')}</div></div>`).join('')
 document.getElementById('vehSave').disabled=!vehDraft
}
function saveVehicle(){ profile.vehicle_class=vehDraft; lsSet(K_CARRIER,profile); closeModal('vehModal'); shown={}; feed().forEach(o=> shown[o.id]=1); showToast('تم حفظ مركبتك'); render() }
// ===== المحفظة =====
function openWallet(){ renderWallet(); document.getElementById('walletModal').classList.add('open') }
function renderWallet(){
 const w=wallet(), b=document.getElementById('wBal')
 b.textContent=money(w.balance); b.className='bal '+(w.balance<0?'neg':'pos')
 document.getElementById('wNote').textContent= w.balance<0? 'مبلغ مستحق — يُسدَّد تلقائياً من الشحن القادم' : trialAvailable(ME.id)? '🎁 لديك طلب تجريبي مجاني: أول اتفاق بدون عمولة (يسقط عند أول شحن)' : 'تُخصم عمولة '+COMMISSION_PCT+' عند إتمام كل اتفاق'
 document.getElementById('wTx').innerHTML= w.tx.length? w.tx.map(t=> `<div class="tx"><div>${t.kind==='topup'? '💳 شحن رصيد'+(t.debt_paid? ` <small>سُدّد منه ${money(t.debt_paid)} مستحق</small>`:'') : (t.trial? `🎁 طلب تجريبي مجاني ${money(t.price)}` : `🧾 عمولة اتفاق ${money(t.price)}`)}<small>${new Date(t.at).toLocaleString('ar-SY',{dateStyle:'short',timeStyle:'short'})} • الرصيد ${money(t.balance_after)}</small></div><b class="${t.amount<0?'m':'p'}">${t.amount<0?'−':'+'}${money(Math.abs(t.amount))}</b></div>`).join('') : '<div class="ofHint">لا توجد حركات بعد</div>'
}
function doTopUp(v){ const wasNeg=blocked(); topUp(ME.id,v); renderWallet(); render(); showToast(wasNeg && !blocked()? 'تم الشحن • عادت الطلبات للظهور' : 'تم شحن '+money(v)) }
// ===== تنبيهات: طلب جديد + ردود الزبائن =====
let shown={}, newQueue=[], newCur=null, newBeep=null, offerSt={}, orderSt={}
function poll(){
 // ردود الزبائن على عروضي
 loadOffers().filter(x=>x.carrier_id===ME.id).forEach(x=>{
   const prev=offerSt[x.id]; offerSt[x.id]=x.status
   if(prev==='pending' && x.status==='accepted'){ notify(880); showToast(x.commission===0? `✅ قبل الزبون عرضك ${money(x.price)} • طلبك التجريبي بدون عمولة` : `✅ قبل الزبون عرضك ${money(x.price)} • خُصمت العمولة ${money(x.commission??commissionOf(x.price))}`); setTab('jobs') }
   else if(prev==='pending' && x.status==='rejected') { notify(440); showToast('اختار الزبون عرضاً آخر') }
 })
 // طلب قُبل من ناقل آخر أثناء فتح تفاصيله
 loadOrders().forEach(o=>{ const prev=orderSt[o.id]; orderSt[o.id]=o.status; if(prev==='open' && o.status!=='open' && o.carrier_id!==ME.id){ if(current&&current.id===o.id){ closeDetail(); showToast('تم قبول الطلب من ناقل آخر', true) } newQueue=newQueue.filter(q=>q.id!==o.id); if(newCur&&newCur.id===o.id) dismissNew() } })
 // طلبات جديدة ضمن النطاق
 feed().forEach(o=>{ if(!shown[o.id]){ shown[o.id]=1; newQueue.push(o) } })
 if(!newCur && newQueue.length) showNew(newQueue.shift())
 render()
}
function showNew(o){
 newCur=o
 document.getElementById('nmBody').innerHTML=`<div class="cHead"><b>${esc(o.cargo_type)}</b><span class="tag veh">${vName(o.vehicle_class)}</span></div>
  <div class="route"><div>🟢 ${esc(o.pickup_points[0].label)}</div><div>🔴 ${esc(o.dropoff_points[o.dropoff_points.length-1].label)}</div></div>
  <div class="budgetLine">${orderBudget(o)}</div><div class="ofHint" style="text-align:right">${orderTiming(o)} • يبعد نحو ${geoKm(MY_LOC,pk(o)).toFixed(1)} كم</div>`
 document.getElementById('newModal').classList.add('open')
 notify(); clearInterval(newBeep); newBeep=setInterval(()=>notify(),3000)
}
function dismissNew(){ clearInterval(newBeep); closeModal('newModal'); newCur=null; if(newQueue.length) setTimeout(()=>showNew(newQueue.shift()),400) }
function viewNew(){ const o=newCur; clearInterval(newBeep); closeModal('newModal'); newCur=null; setTab('feed'); openDetail(o.id) }
// ===== بيانات تجريبية =====
const DEMO_SPOTS=[
 {p:[33.5102,36.2913],d:[33.5405,36.3120]}, {p:[33.5230,36.2600],d:[33.4960,36.2380]}, {p:[33.4978,36.2976],d:[33.5480,36.2750]},
 {p:[33.5350,36.2890],d:[33.5010,36.3200]}, {p:[33.5060,36.2550],d:[33.5290,36.3050]}, {p:[33.6200,36.1300],d:[33.5200,36.2900]},
]
const DEMO_LABELS=[['شارع بغداد، القصاع، دمشق','جرمانا، ريف دمشق'],['المزرعة، دمشق','المزة، دمشق'],['باب شرقي، دمشق','ركن الدين، دمشق'],['العباسيين، دمشق','الدويلعة، دمشق'],['كفرسوسة، دمشق','برزة، دمشق'],['قدسيا، ريف دمشق','ساحة الأمويين، دمشق']]
function demoOrder(i, over){
 const s=DEMO_SPOTS[i%DEMO_SPOTS.length], L2=DEMO_LABELS[i%DEMO_LABELS.length]
 return Object.assign({id:uid(), created_at:Date.now()-i*420000, customer_id:DEMO_CUSTOMER.id, customer:DEMO_CUSTOMER,
  cargo_type:'مفروشات منزل', weight_kg:null, vehicle_class:'pk1200',
  pickup_points:[{label:L2[0], lat:s.p[0], lng:s.p[1], detail:null}], dropoff_points:[{label:L2[1], lat:s.d[0], lng:s.d[1], detail:null}],
  route_info:null, need_workers:false, workers_count:null, need_equipment:false, equipment_detail:null,
  lift_up:false, floor_to:null, elevator_to:null, lift_down:false, floor_from:null, elevator_from:null, floor_note:null,
  timing:'urgent', sched_date:null, sched_time:null, budget_type:'fixed', budget_from:30, budget_to:50, status:'open', carrier_id:null, agreed_price:null}, over)
}
function seed(){
 if(loadOrders().length) return
 saveOrders([
  demoOrder(0,{cargo_type:'مفروشات منزل', vehicle_class:'pk1200', need_workers:true, workers_count:2, lift_down:true, floor_from:3, elevator_from:'لا يوجد مصعد', budget_from:30, budget_to:50}),
  demoOrder(1,{cargo_type:'أجهزة كهربائية', vehicle_class:'pk800', budget_type:'quote', budget_from:null, budget_to:null, weight_kg:350}),
  demoOrder(2,{cargo_type:'مواد بناء', vehicle_class:'md4', weight_kg:3500, budget_from:60, budget_to:90, timing:'scheduled', sched_date:'2026-09-27', sched_time:'08:00'}),
  demoOrder(3,{cargo_type:'مواد تموينية', vehicle_class:'pk1500', budget_type:'quote', budget_from:null, budget_to:null}),
  demoOrder(4,{cargo_type:'أثاث مكتب', vehicle_class:'truck', budget_from:120, budget_to:180}),
  demoOrder(5,{cargo_type:'مفروشات', vehicle_class:'pk800', budget_from:40, budget_to:60}),
 ])
}
let simI=0
function simulateOrder(){
 const V=profile.vehicle_class||'pk800', v=vOf(V), smaller=VCLASS.filter(x=>x.g===v.g && x.r<=v.r)
 const all=loadOrders(); all.unshift(demoOrder(simI++,{created_at:Date.now(), cargo_type:['أجهزة كهربائية','مفروشات','مواد تموينية'][simI%3], vehicle_class:smaller[simI%smaller.length].k, budget_type: simI%2? 'quote':'fixed', budget_from: simI%2? null:25, budget_to: simI%2? null:45}))
 saveOrders(all); poll()
}
// ===== بداية =====
seed()
initFeedMap()
loadOffers().forEach(x=> offerSt[x.id]=x.status); loadOrders().forEach(o=> orderSt[o.id]=o.status)
feed().forEach(o=> shown[o.id]=1)
render()
if(!profile.vehicle_class) openVehicle()
setInterval(poll,2000)
</script>
