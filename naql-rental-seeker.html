<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأجير - باحث عن خدمة تأجير</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function showToast(msg, isError=false){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;
  t.className='toast'+(isError?' error':'');
  t.style.display='block';
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=> t.style.display='none', 2500);
}

</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f8fafc;color:#0f172a;max-width:560px;margin:0 auto}
.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 16px;display:flex;align-items:center;gap:12px}
.header h1{font-size:17px;font-weight:900}
.header p{font-size:11px;color:#64748b}
.back{width:40px;height:40px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;display:grid;place-items:center;cursor:pointer}
.filters{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin:12px}
.filters h2{font-size:13px;font-weight:900;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;border:1.5px solid #e2e8f0;background:#fff;font-size:12px;font-weight:800;cursor:pointer}
.chip.active{background:#4F46E5;color:#fff;border-color:#4F46E5}
.input{width:100%;height:40px;border:1.5px solid #e2e8f0;border-radius:10px;padding:0 10px;font-size:13px;background:#fff;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
.card{border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;transition:.15s}
.card:hover{border-color:#4F46E5;transform:translateY(-1px)}
.card img{width:100%;height:110px;object-fit:cover;background:#e2e8f0}
.cardBody{padding:10px}
.card h3{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:11px;color:#64748b;margin:4px 0}
.card .loc{font-size:11px;color:#4F46E5}
.card button{width:100%;margin-top:8px;height:36px;border-radius:10px;border:none;background:#4F46E5;color:#fff;font-weight:800;font-size:12px;cursor:pointer}
.leaflet-map{height:160px;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;margin-top:8px}
/* modal */
.modalOverlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:end;justify-content:center;z-index:50}
.modalOverlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:16px;animation:slideUp .2s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:16px;font-weight:900;text-align:center}
.modal .hint{font-size:12px;color:#64748b;text-align:center;margin:6px 0}
.stepper{display:flex;align-items:center;gap:8px;background:#f1f5f9;border-radius:999px;padding:4px;width:fit-content;margin:8px auto}
.stepper button{width:36px;height:36px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;font-weight:900;cursor:pointer}
.stepper b{min-width:24px;text-align:center}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;display:none;max-width:90%;text-align:center}
.toast.error{background:#991b1b}

</style>
</head>
<body>
<div class="header">
<div class="back" onclick="history.back()">→</div>
<div>
<h1>🔍 باحث عن خدمة تأجير</h1>
<p>تصفح المركبات المتاحة — بدون أسعار، اطلب عرض حسب مدتك</p>
</div>
</div>

<div class="filters">
<h2>🔎 فلترة</h2>
<div class="chips" id="filterChips">
<span class="chip active" data-f="all" onclick="setFilter('all')">الكل</span>
<span class="chip" data-f="car" onclick="setFilter('car')">سيارة</span>
<span class="chip" data-f="suv" onclick="setFilter('suv')">SUV</span>
<span class="chip" data-f="van_8" onclick="setFilter('van_8')">فان 8</span>
<span class="chip" data-f="van_11" onclick="setFilter('van_11')">فان 11</span>
<span class="chip" data-f="bus_small_14" onclick="setFilter('bus_small_14')">باص 14</span>
</div>
<div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
<input type="date" id="filterFrom" class="input" onchange="applyFilter()">
<input type="date" id="filterTo" class="input" onchange="applyFilter()">
</div>
<div id="mapFilter" class="leaflet-map"></div>
<p style="font-size:11px;color:#64748b;text-align:center;margin-top:6px">خريطة المكاتب القريبة — اضغط أي بطاقة لطلب عرض</p>
</div>

<div class="grid" id="grid"></div>

<!-- مودال طلب عرض -->
<div class="modalOverlay" id="modal" onclick="if(event.target===this) closeModal()">
<div class="modal">
<div style="width:40px;height:4px;border-radius:999px;background:#e2e8f0;margin:0 auto 12px"></div>
<h2 id="modalTitle">اطلب عرض سعر</h2>
<p class="hint" id="modalSub">حدد المدة التي تحتاجها</p>

<div style="text-align:center;margin:8px 0">
<img id="modalImg" src="" style="width:100%;height:140px;object-fit:cover;border-radius:12px;background:#e2e8f0">
<h3 id="modalCar" style="font-size:15px;font-weight:900;margin-top:8px"></h3>
<p id="modalMeta" style="font-size:12px;color:#64748b"></p>
</div>

<div style="margin-top:12px">
<label style="font-size:12px;font-weight:800">المدة</label>
<div class="chips" style="justify-content:center;margin-top:6px">
<span class="chip active" data-d="hours" onclick="setDur('hours')">ساعات</span>
<span class="chip" data-d="days" onclick="setDur('days')">أيام</span>
<span class="chip" data-d="week" onclick="setDur('week')">أسبوع</span>
<span class="chip" data-d="month" onclick="setDur('month')">شهر</span>
</div>
<div class="stepper">
<button onclick="stepVal(-1)">−</button><b id="durVal">2</b><span id="durUnit" style="font-size:12px;font-weight:800">ساعة</span><button onclick="stepVal(1)">＋</button>
</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
<div><label style="font-size:12px;font-weight:800">من</label><input id="reqFrom" type="datetime-local" class="input" style="margin-top:4px"></div>
<div><label style="font-size:12px;font-weight:800">إلى</label><input id="reqTo" type="datetime-local" class="input" style="margin-top:4px"></div>
</div>

<div style="margin-top:12px">
<label style="font-size:12px;font-weight:800">ملاحظات (اختياري)</label>
<textarea id="reqNotes" rows="2" style="width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px;font-size:13px;outline:none;margin-top:4px" placeholder="مثال: أحتاج توصيل للمنزل، تأمين شامل..."></textarea>
</div>

<button onclick="sendRequest()" style="width:100%;height:48px;border-radius:14px;border:none;background:#4F46E5;color:#fff;font-weight:900;font-size:15px;margin-top:14px;cursor:pointer">📩 إرسال طلب عرض سعر</button>
<button onclick="closeModal()" style="width:100%;height:44px;border-radius:14px;border:1px solid #e2e8f0;background:#fff;font-weight:800;margin-top:8px;cursor:pointer">إلغاء</button>
</div>
</div>

<script>
let vehicles=[
 {id:1, title:'تويوتا كورولا 2023', cat:'car', year:2023, seats:5, trans:'أوتوماتيك', img:'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=400', loc:'على بعد 1.2 كم', rating:'4.8 ★ (127)', driver:true},
 {id:2, title:'هيونداي سانتافي SUV 2022', cat:'suv', year:2022, seats:7, trans:'أوتوماتيك', img:'https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=400', loc:'على بعد 2.4 كم', rating:'4.9 ★ (89)'},
 {id:3, title:'فان هيونداي H1 — 11 راكب', cat:'van_11', year:2021, seats:11, trans:'عادي', img:'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=400', loc:'على بعد 0.8 كم', rating:'4.7 ★ (203)'},
 {id:4, title:'كيا سيراتو 2024', cat:'car', year:2024, seats:5, trans:'أوتوماتيك', img:'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=400', loc:'على بعد 3.1 كم', rating:'4.6 ★ (64)'},
 {id:5, title:'باص صغير 14 راكب', cat:'bus_small_14', year:2020, seats:14, trans:'عادي', img:'https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=400', loc:'على بعد 1.9 كم', rating:'4.8 ★ (112)'},
 {id:6, title:'فان 8 راكب — عائلي', cat:'van_8', year:2022, seats:8, trans:'أوتوماتيك', img:'https://images.unsplash.com/photo-1553444836-bc6c8d340ba7?w=400', loc:'على بعد 0.5 كم', rating:'4.9 ★ (45)'},
]
let currentFilter='all', selectedVehicle=null, durType='hours', durVal=2
let map=null

function renderGrid(){
 const g=document.getElementById('grid'); g.innerHTML=''
 const list = currentFilter==='all'? vehicles : vehicles.filter(v=> v.cat===currentFilter)
 list.forEach(v=>{
   const d=document.createElement('div'); d.className='card'; d.onclick=()=> openModal(v)
   d.innerHTML=`<img src="${v.img}" onerror="this.style.background='#e2e8f0'"><div class="cardBody"><h3>${v.title}</h3><div class="meta">${v.seats} مقاعد • ${v.trans} • ${v.year}</div><div class="loc">📍 ${v.loc}</div><div style="font-size:11px;color:#f59e0b">${v.rating}</div>${v.driver?'<div style="font-size:10px;background:#eef2ff;color:#4F46E5;padding:2px 6px;border-radius:999px;display:inline-block;margin-top:4px">سائق • متاح للتأجير بدون سائق</div>':''}<button onclick="event.stopPropagation(); openModal(vehicles.find(x=>x.id===${v.id}))">📩 اطلب عرض سعر</button></div>`
   g.appendChild(d)
 })
}
function setFilter(f){
 currentFilter=f
 document.querySelectorAll('#filterChips .chip').forEach(c=> c.classList.toggle('active', c.dataset.f===f))
 renderGrid()
}
function applyFilter(){ /* للتواريخ — في النسخة الحقيقية تُفلتر حسب التوفر */ }

function openModal(v){
 selectedVehicle=v
 document.getElementById('modalImg').src=v.img
 document.getElementById('modalCar').textContent=v.title
 document.getElementById('modalMeta').textContent=`${v.seats} مقاعد • ${v.trans} • ${v.year} — ${v.loc}`
 document.getElementById('modal').classList.add('open')
 setDur(durType)
}
function closeModal(){ document.getElementById('modal').classList.remove('open') }

function setDur(t){
 durType=t
 document.querySelectorAll('[data-d]').forEach(c=> c.classList.toggle('active', c.dataset.d===t))
 const units={hours:'ساعة', days:'يوم', week:'أسبوع', month:'شهر'}
 document.getElementById('durUnit').textContent=units[t]
 if(t==='hours') durVal=2; else if(t==='days') durVal=1; else durVal=1
 document.getElementById('durVal').textContent=durVal
}
function stepVal(d){
 const max={hours:72, days:30, week:4, month:12}[durType]
 durVal=Math.max(1, Math.min(max, durVal+d))
 document.getElementById('durVal').textContent=durVal
}
function sendRequest(){
 const payload={
   vehicle_id: selectedVehicle.id,
   vehicle_title: selectedVehicle.title,
   duration_type: durType,
   duration_value: durVal,
   from: document.getElementById('reqFrom').value||null,
   to: document.getElementById('reqTo').value||null,
   notes: document.getElementById('reqNotes').value.trim()||null,
 }
 console.log('rental quote request', payload)
 showToast('📩 تم إرسال طلب عرض سعر\n'+JSON.stringify(payload,null,2)+'\n\nسيصلك رد المكتب قريباً داخل التطبيق')
 closeModal()
}
function initMap(){
 map=L.map('mapFilter',{zoomControl:false}).setView([33.5138,36.2765],11)
 L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map)
 vehicles.forEach((v,i)=>{
   const lat=33.5138 + (Math.random()-0.5)*0.12, lng=36.2765 + (Math.random()-0.5)*0.12
   L.marker([lat,lng]).addTo(map).bindPopup(v.title)
 })
 setTimeout(()=> map.invalidateSize(), 300)
}
renderGrid(); setTimeout(initMap, 200)
</script>
<div id="toast" class="toast"></div>
</body>
</html>
