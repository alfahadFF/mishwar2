name: EAS Update (Android OTA)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target channel'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]
      message:
        description: 'Short update description'
        required: true
        default: 'تحديث جديد'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Publish update
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_CHANNEL: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: eas update --platform android --channel "$UPDATE_CHANNEL" --environment "$UPDATE_CHANNEL" --message "$UPDATE_MESSAGE" --non-interactive
