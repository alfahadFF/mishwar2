name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (development=dev-client, preview=APK test, production=AAB store)'
        required: true
        default: 'preview'
        type: choice
        options: [development, preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Start cloud build
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
