<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مشوار — معاينة التطبيق كامل</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;background:#e9ecf2;color:#0f172a;min-height:100vh}
button{font-family:inherit;border:0;cursor:pointer}
.wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:24px}
.side{width:270px;background:#fff;border-radius:18px;padding:14px;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.side h2{font-size:15px;margin-bottom:4px}.side p{font-size:11px;color:#64748b;margin-bottom:10px}
.grp{font-size:11px;font-weight:800;color:#FF6B00;margin:12px 4px 6px}
.nav{display:block;width:100%;text-align:right;background:#f8fafc;border-radius:10px;padding:8px 10px;margin-bottom:4px;font-size:13px;font-weight:600;color:#1A1A2E}
.nav.on{background:#1A1A2E;color:#fff}
.phone{width:390px;height:800px;background:#111;border-radius:46px;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.25);flex-shrink:0}
.screen{width:100%;height:100%;background:#F8F9FA;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:700;background:#fff;flex-shrink:0}
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.body::-webkit-scrollbar{width:0}
.menuBtn{display:none}
@media (max-width:760px){
  .wrap{padding:0}.side{display:none;position:fixed;inset:0;width:auto;max-height:none;border-radius:0;z-index:100}
  .side.open{display:block}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}.status{display:none}
  .menuBtn{display:flex;position:fixed;bottom:84px;left:12px;z-index:90;background:#1A1A2E;color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .closeSide{display:block!important}
}
.closeSide{display:none;float:left;background:#f1f5f9;border-radius:10px;padding:6px 10px;font-weight:800}
/* عام */
.top{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #f1f5f9;flex-shrink:0;position:sticky;top:0;z-index:5}
.hdr{height:54px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:5}
.hdr .b{width:36px;height:36px;border-radius:10px;background:#f1f5f9;font-size:18px}
.hdr h1{font-size:16px;font-weight:900;flex:1}
.pad{padding:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin-bottom:10px}
.h{font-weight:900;font-size:15px}.sub{font-size:12px;color:#64748b;margin-top:3px;line-height:1.6}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}
.btn{display:block;width:100%;background:#FF6B00;color:#fff;font-weight:900;font-size:15px;border-radius:14px;padding:13px;margin-top:8px}
.btn.dark{background:#1A1A2E}.btn.brand{background:#4F46E5}.btn.ghost{background:#eef2ff;color:#4F46E5}.btn.ok{background:#047857}.btn.red{background:#dc2626}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:13px;border-radius:10px;margin:0}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;background:#f1f5f9;color:#475569}
.pill.ok{background:#ecfdf5;color:#047857}.pill.warn{background:#fffbeb;color:#b45309}.pill.err{background:#fef2f2;color:#b91c1c}.pill.brand{background:#eef2ff;color:#4F46E5}.pill.or{background:#fff4ec;color:#FF6B00}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid #e2e8f0;background:#fff;border-radius:12px;padding:7px 11px;font-size:12px;font-weight:700;color:#334155}
.chip.on{border-color:#FF6B00;background:#fff4ec;color:#FF6B00}
.lbl{font-size:12px;font-weight:800;color:#475569;margin:12px 2px 6px}
.inp{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:11px;font-size:14px;font-family:inherit;background:#fff;text-align:right}
.pt{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px dashed #cbd5e1;border-radius:12px;padding:10px;margin-bottom:6px;font-size:13px}
.pt .d{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.pt.set{border-style:solid}
.stars{background:#fffbeb;color:#92400e;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:800;display:inline-block}
.tabbar{height:64px;background:#fff;border-top:1px solid #f1f5f9;display:flex;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#6B7280;background:none;gap:2px}
.tab b{font-size:18px;font-weight:400}.tab.on{color:#FF6B00;font-weight:800}
.map{position:relative;height:300px;background:#eef1e6;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(50%,-100%);font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.car{position:absolute;font-size:18px;transition:all 2s linear}
.car.fade{opacity:.3}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;z-index:50}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:16px;max-height:88%;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#1A1A2E;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:60;display:none;max-width:88%;text-align:center}
.toast.show{display:block;animation:up .2s}
.sos{position:absolute;left:12px;bottom:78px;width:52px;height:52px;border-radius:50%;background:#dc2626;color:#fff;font-weight:900;font-size:13px;z-index:20;box-shadow:0 6px 18px rgba(220,38,38,.45)}
.seg{display:flex;background:#f1f5f9;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;padding:8px;border-radius:10px;font-size:12px;font-weight:800;color:#64748b}
.seg button.on{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:6px}
.hist{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin-bottom:6px;font-size:13px}
.slider{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}.slider::-webkit-scrollbar{height:0}
.cat{min-width:92px;border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:8px;text-align:center}
.cat.on{border-color:#FF6B00;background:#fff4ec}.cat.off{opacity:.4}
.cat .i{font-size:22px}.cat .n{font-size:12px;font-weight:800}.cat .p{font-size:12px;color:#FF6B00;font-weight:900}.cat .e{font-size:10px;color:#64748b}
.photos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:4px;height:130px;border-radius:12px;overflow:hidden;margin-bottom:8px}
.photos div{background:linear-gradient(135deg,#cbd5e1,#94a3b8);display:flex;align-items:center;justify-content:center;font-size:30px}
.photos div:first-child{grid-row:span 2;font-size:48px}
.draft{background:#fffbeb;border:1px dashed #f59e0b;color:#92400e;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700;margin-bottom:10px}
.star{font-size:34px;color:#e2e8f0;background:none}.star.on{color:#f59e0b}
.pop{position:absolute;inset:auto 12px 12px 12px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);z-index:30;border:2px solid #FF6B00;animation:up .25s}
.big{font-size:26px;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side" id="side">
    <button class="closeSide" onclick="toggleSide()">✕</button>
    <h2>📱 مشوار — كل الشاشات</h2>
    <p>معاينة تفاعلية بأرقام تجريبية. اضغط على أي شاشة، أو تنقّل من جوّا التطبيق.</p>
    <div id="navList"></div>
  </aside>
  <div class="phone"><div class="screen" id="screen">
    <div class="status"><span>9:41</span><span>📶 🔋</span></div>
    <div class="body" id="body"></div>
    <div id="tabs"></div>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
  </div></div>
</div>
<button class="menuBtn" onclick="toggleSide()">☰ الشاشات</button>

<script>
const $=id=>document.getElementById(id);
let cur='home', hist=[];
const toast=(m)=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)};
const openSheet=h=>{$('sheet').innerHTML=h;$('ov').classList.add('show')};
const closeSheet=()=>$('ov').classList.remove('show');
function toggleSide(){$('side').classList.toggle('open')}
const hdr=(t,right='')=>`<div class="hdr"><button class="b" onclick="back()">→</button><h1>${t}</h1>${right}</div>`;
const pt=(c,b,t,l,set=true)=>`<div class="pt ${set?'set':''}"><div class="d" style="background:${c}">${b}</div><div style="flex:1"><div style="font-size:11px;color:#64748b">${t}</div><div style="font-weight:700">${set?l:'اضغط لتحديد النقطة على الخريطة'}</div></div><span>🗺️</span></div>`;
const chips=(arr,on=0,id='')=>`<div class="chips">${arr.map((a,i)=>`<button class="chip ${i===on?'on':''}" onclick="pick(this)">${a}</button>`).join('')}</div>`;
function pick(el){[...el.parentNode.children].forEach(c=>c.classList.remove('on'));el.classList.add('on')}
const lv={bronze:'🥉',silver:'🥈',gold:'🥇',diamond:'💎'};
const stars=(a,n,l)=>n?`<span class="stars">${l&&l!=='bronze'?lv[l]+' ':''}⭐ ${a} · ${n}</span>`:`<span class="stars" style="background:#f1f5f9;color:#64748b">✨ جديد</span>`;

// خريطة وهمية بشوارع
function map(h=300,extra='',route=true){
  return `<div class="map" style="height:${h}px"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="300" fill="#eef1e6"/>
  <rect x="250" y="20" width="110" height="70" rx="8" fill="#d9ead3"/><rect x="30" y="200" width="90" height="70" rx="8" fill="#d9ead3"/>
  <path d="M0 60 L400 90" stroke="#fff" stroke-width="14"/><path d="M0 180 L400 150" stroke="#fff" stroke-width="18"/>
  <path d="M90 0 L130 300" stroke="#fff" stroke-width="12"/><path d="M270 0 L240 300" stroke="#fff" stroke-width="14"/>
  <path d="M0 250 Q200 230 400 270" stroke="#fde68a" stroke-width="10" fill="none"/>
  <path d="M180 0 L200 300" stroke="#fff" stroke-width="8"/>
  ${route?'<path d="M112 70 L125 165 L245 152 L258 70" stroke="#4F46E5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':''}
  </svg>${route?'<div class="pin" style="right:72%;top:24%">🟢</div><div class="pin" style="right:35%;top:24%">📍</div>':''}${extra}</div>`;
}
function back(){cur=hist.pop()||'home';render(false)}
function go(s){if(s!==cur)hist.push(cur);cur=s;render(false)}

const TAB=`<div class="tabbar">${[['home','🏠','الرئيسية'],['orders','🧾','طلباتي'],['wallet','👛','المحفظة'],['loyalty','🎁','نقاطي'],['me','👤','حسابي']].map(([k,i,l])=>`<button class="tab ${cur===k?'on':''}" onclick="${k==='me'?"toast('يتطلب تسجيل الدخول')":`go('${k}')`}"><b>${i}</b>${l}</button>`).join('')}</div>`;

const S={};
/* ===================== الزبون ===================== */
S.home={g:'الزبون',t:'🏠 الرئيسية',tabs:1,h:()=>`
