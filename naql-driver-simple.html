<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سائق - مبسط</title><style>body{font-family:system-ui;max-width:520px;margin:0 auto;background:#f8fafc;padding:12px} .card{border:1px solid #e2e8f0;border-radius:14px;padding:12px;background:#fff;margin-bottom:10px} .btn{padding:8px 14px;border-radius:999px;border:none;font-weight:900;cursor:pointer} .accept{background:#22c55e;color:#fff} .call{background:#4F46E5;color:#fff;width:100%;height:44px;border-radius:12px;display:none;margin-top:12px} .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:12px 20px;border-radius:999px;display:none;z-index:999}</style></head><body>
<h2 style="text-align:center">🚕 لوحة السائق - مبسطة</h2>
<div id="list"></div>
<button id="callBtn" class="call" onclick="window.location.href='tel:+963900000000'">📞 اتصال بالعميل</button>
<div id="toast" class="toast"></div>
<script>
const reqs=[
 {id:1, from:'الحي الشمالي', to:'المركز', dist:'2.4 كم', cat:'عادية', price:'$2.44'},
 {id:2, from:'المزة', to:'الجامعة', dist:'4.1 كم', cat:'اقتصادية', price:'$2.85'},
]
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=> t.style.display='none',2000); }
function render(){
 const c=document.getElementById('list'); c.innerHTML=''
 reqs.forEach(r=>{
   const d=document.createElement('div'); d.className='card'
   d.innerHTML=`<b>${r.from} → ${r.to}</b><div style="font-size:12px;color:#64748b">${r.dist} • ${r.cat} • ${r.price}</div><button class="btn accept" onclick="accept(${r.id})">قبول</button>`
   c.appendChild(d)
 })
}
function accept(id){
 showToast('تم قبول الطلب');
 document.getElementById('callBtn').style.display='block'
 // إخفاء الطلب المقبول
 const idx=reqs.findIndex(x=> x.id===id)
 if(idx>-1) reqs.splice(idx,1)
 render()
}
render()
</script>
</body></html>
