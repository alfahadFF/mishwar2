<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار Toast</title><style>body{font-family:system-ui;padding:20px;text-align:center} button{padding:12px 20px;border-radius:12px;border:none;background:#4F46E5;color:#fff;font-weight:900;cursor:pointer} .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;display:none}</style></head><body>
<h2>اختبار Toast</h2>
<button onclick="showToast('تمت إضافتك للرحلة')">اضغط لاختبار الرسالة</button>
<div id="toast" class="toast"></div>
<script>
function showToast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;
  t.style.display='block';
  clearTimeout(window._t);
  window._t=setTimeout(()=> t.style.display='none', 2500);
}
</script>
</body></html>
